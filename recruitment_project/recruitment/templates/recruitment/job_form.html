{% extends "recruitment/base.html" %}
{% block title %}{{ mode }} Job Posting{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card stat-card p-4">
      <h3 class="mb-3">{{ mode }} Job Posting</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ mode }} Job</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
