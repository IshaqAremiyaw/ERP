{% extends "recruitment/base.html" %}
{% block title %}HR Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card stat-card p-4">
      <h3 class="mb-3">💼 HR Registration</h3>
      <p class="text-muted small">Requires an invite code from your admin.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Create HR Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
