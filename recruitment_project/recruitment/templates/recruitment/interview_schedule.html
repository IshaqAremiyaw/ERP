{% extends "recruitment/base.html" %}
{% block title %}Schedule Interview{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card stat-card p-4">
      <h3 class="mb-1">📅 {% if edit_mode %}Edit{% else %}Schedule{% endif %} Interview</h3>
      <p class="text-muted mb-3">{{ application.applicant.username }} — {{ application.job_posting.title }}</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
